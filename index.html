   (la que termina en /exec). Mientras esté vacía, la página
   funciona en modo demostración con alumnos inventados.          */
const API_URL = "https://script.google.com/macros/s/AKfycbxCnEQm0L5WckUnYz0Y8AfdPHPlEWR8vOLk_v9zKHLl5TitetTTekwfm_Evny4JaQPw/exec";

<style>
:root{
  --pizarron:#1F4037; --pizarron-claro:#2B5549; --pizarron-hondo:#173028;
  --marco:#B98C5F;
  --tiza:#F4F6F0; --papel:#FAFBF7; --renglon:#CFD9E6;
  --tinta:#1A2230; --tinta-suave:#566070;
  --birome:#2348B5; --amarillo:#F2C744; --rojo:#C23B2A;
  --titulo:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --texto:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--papel);color:var(--tinta);font:400 1.0625rem/1.5 var(--texto)}
h1,h2{font-family:var(--titulo);font-weight:700;line-height:1.08;letter-spacing:-.015em;margin:0}
h1{font-size:clamp(1.9rem,6vw,2.6rem)}
h2{font-size:1.2rem}
p{margin:.6rem 0 0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--birome);outline-offset:2px}
.pizarra :focus-visible,.resultado.ok :focus-visible{outline-color:var(--amarillo)}
[hidden]{display:none!important}

/* ── Piezas comunes ── */
.hoja{max-width:34rem;margin:0 auto;padding:clamp(1rem,4vw,2.5rem) clamp(1rem,4vw,1.5rem) 3rem}
.pizarra{
  background:radial-gradient(130% 100% at 15% 0%,var(--pizarron-claro) 0%,var(--pizarron) 50%,var(--pizarron-hondo) 100%);
  color:var(--tiza);border:7px solid var(--marco);border-radius:14px;padding:clamp(1.25rem,4vw,2.25rem);
}
label{display:block;font-weight:700;margin:1.2rem 0 .35rem}
input[type=text],input[type=password]{
  width:100%;padding:.8rem .9rem;border:1.5px solid var(--tinta);border-radius:8px;background:#fff;font-size:1.1rem;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:3rem;padding:.65rem 1.2rem;
  border:1.5px solid var(--pizarron);border-radius:8px;background:var(--pizarron);color:var(--tiza);
  font-weight:700;cursor:pointer;text-align:center;
}
.btn:hover{background:var(--pizarron-hondo)}
.btn[disabled]{opacity:.55;cursor:progress}
.btn.claro{background:transparent;color:var(--tinta);border-color:var(--tinta)}
.btn.claro:hover{background:rgba(26,34,48,.07)}
.btn.rojo{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn.ancho{width:100%;margin-top:.9rem}
.pizarra .btn.claro,.resultado.ok .btn.claro{color:var(--tiza);border-color:var(--tiza)}
.pizarra .btn.claro:hover,.resultado.ok .btn.claro:hover{background:rgba(244,246,240,.12)}
.enlace{background:none;border:0;padding:.4rem 0;text-decoration:underline;cursor:pointer}
.error{color:var(--rojo);font-weight:700;min-height:1.5rem;margin:.5rem 0 0}
.nota{color:var(--tinta-suave);font-size:.95rem}
.pizarra .nota{color:inherit;opacity:.8}
.demo{background:#FFF4CC;border-left:5px solid var(--amarillo);padding:.75rem 1rem;margin-top:1.25rem;border-radius:0 8px 8px 0}

/* ── Ingreso y panel del docente ── */
.portada h1{font-size:clamp(2.6rem,11vw,4rem);font-weight:800}
.portada p{max-width:28ch;font-size:1.1rem}
.cabecera{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.5rem;font-weight:700}
.abiertas{margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1.5px solid var(--tinta)}
.cursos{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:.6rem;margin-top:1.1rem}
.curso{padding:.75rem .85rem;border:1.5px solid var(--tinta);border-radius:8px;background:#fff;text-align:left;cursor:pointer}
.curso b{display:block;font-family:var(--titulo);font-size:1.45rem;line-height:1.1}
.curso small{color:var(--tinta-suave);font-size:.9rem}
.curso[aria-pressed=true]{background:var(--pizarron);border-color:var(--pizarron);color:var(--tiza)}
.curso[aria-pressed=true] small{color:inherit;opacity:.85}

/* ── Clase en curso ── */
.clase{min-height:100vh;display:flex;flex-direction:column}
.barra{
  display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;justify-content:space-between;
  padding:.9rem clamp(1rem,3vw,2rem);border-bottom:1.5px solid var(--tinta);
}
.barra h1{font-size:clamp(1.7rem,4vw,2.3rem)}
.barra p{margin:.15rem 0 0;color:var(--tinta-suave)}
.acciones{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.acciones .btn{min-height:2.6rem;padding:.45rem .95rem}
.confirmar{font-weight:700}
.cuerpo{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(1.25rem,3vw,2rem);padding:clamp(1rem,3vw,2rem);align-content:start}
@media(min-width:880px){.cuerpo{grid-template-columns:minmax(0,1fr) minmax(19rem,26rem);align-items:start}}
.tablero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.9rem}
.tablero p{margin:0}
.qr{width:min(100%,56vh,30rem);aspect-ratio:1;background:#fff;color:#000;border-radius:10px;padding:.4rem;display:grid;place-items:center}
.qr svg{display:block;width:100%;height:100%}
.qr p{padding:1rem;font-weight:700}
.tiempo{width:min(100%,56vh,30rem);height:6px;border-radius:3px;background:rgba(244,246,240,.22);overflow:hidden}
.tiempo i{display:block;height:100%;background:var(--amarillo);transform-origin:left center}
.instruccion{font-size:1.15rem}
.conteo{font-family:var(--titulo);font-size:clamp(1.3rem,3.2vw,1.8rem);font-weight:600}
.conteo b{font-size:2.3em;font-weight:800;line-height:1}
.resumen{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem 2.5rem;margin:.5rem 0}
.resumen div{display:flex;flex-direction:column-reverse}
.resumen dt{font-size:1rem}
.resumen dd{margin:0;font-family:var(--titulo);font-weight:800;font-size:clamp(2.6rem,8vw,4rem);line-height:1}

.lista ol{list-style:none;margin:.6rem 0 0;padding:0;border-top:1.5px solid var(--tinta)}
.lista li{display:flex;flex-wrap:wrap;align-items:center;gap:0 .75rem;min-height:3rem;padding:.3rem .25rem;border-bottom:1px solid var(--renglon)}
.nombre{flex:1;min-width:9rem}
.hora{color:var(--tinta-suave);font-size:.92rem;font-variant-numeric:tabular-nums}
.marca{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;font-family:var(--titulo);font-weight:800;border:2px solid currentColor}
.marca.P{color:var(--birome);transform:rotate(-7deg)}
.marca.T{color:#8A6400;background:#FFF4CC;transform:rotate(5deg)}
.marca.A{color:var(--rojo)}
.marca.vacia{border:1.5px dashed #9AA5B4}
.fila{all:unset;box-sizing:border-box;flex:1;display:flex;align-items:center;gap:.75rem;min-height:2.4rem;cursor:pointer}
.fila:focus-visible{outline:3px solid var(--birome);outline-offset:2px}
.fila:hover .marca.vacia{border-style:solid;border-color:var(--tinta)}
.manual{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;width:100%;padding:.1rem 0 .5rem}
.manual .btn{min-height:2.4rem;padding:.3rem .9rem}
li.nuevo .marca{animation:sello .5s cubic-bezier(.2,1.5,.4,1) both}
li.nuevo{animation:resalte 1.6s ease-out}
@keyframes sello{from{transform:scale(2.4) rotate(-22deg);opacity:0}}
@keyframes resalte{from{background:#DDE6FB}to{background:transparent}}
.aviso-red{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);margin:0;background:var(--tinta);color:#fff;padding:.6rem 1rem;border-radius:8px;max-width:calc(100% - 2rem)}

body.proyector .lista,body.proyector .barra p,body.proyector #zona-cierre{display:none}
body.proyector .cuerpo{grid-template-columns:minmax(0,1fr)}
body.proyector .qr,body.proyector .tiempo{width:min(100%,66vh)}

/* ── Pantalla del alumno ── */
.alumno{min-height:100vh;max-width:30rem;margin:0 auto;padding:1.5rem;display:flex;flex-direction:column;justify-content:center}
.alumno .donde{margin:0 0 .5rem;font-weight:700;color:var(--tinta-suave)}
.alumno input{font-size:1.5rem;letter-spacing:.06em}
.espera{align-items:center;text-align:center;font-size:1.3rem;font-weight:700}
.resultado{max-width:none;align-items:center;text-align:center}
.resultado h1{font-weight:800;font-size:clamp(3.2rem,17vw,6rem)}
.resultado .quien{font-size:1.55rem;font-weight:700;margin-top:1rem}
.resultado .nota{margin-top:1.75rem}
.resultado .btn{margin-top:1.5rem}
.resultado.ok{background:radial-gradient(130% 100% at 15% 0%,var(--pizarron-claro) 0%,var(--pizarron) 50%,var(--pizarron-hondo) 100%);color:var(--tiza)}
.resultado.ok .nota{color:inherit;opacity:.8}
.resultado.tarde{background:var(--amarillo)}
.resultado.tarde .nota{color:inherit}
.resultado.ok h1,.resultado.tarde h1{animation:sello .55s cubic-bezier(.2,1.4,.4,1) both}
.resultado.mal h1{font-size:clamp(2rem,9vw,2.8rem);color:var(--rojo)}
.resultado.mal .motivo{font-size:1.25rem;font-weight:700;max-width:26ch}
.resultado.mal .nota{max-width:34ch}

@media(prefers-reduced-motion:reduce){
  li.nuevo,li.nuevo .marca,.resultado h1{animation:none!important}
}
</style>

<body>
<main id="app"></main>
<noscript><p style="padding:1.5rem">Esta página necesita JavaScript para funcionar.</p></noscript>

<script>
(function () {
'use strict';

const DEMO = !API_URL;
const QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
const app = document.getElementById('app');
const $ = function (sel) { return document.querySelector(sel); };
const esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};

/* Almacenamiento del navegador, con respaldo en memoria si está bloqueado. */
const memoria = {};
const store = {
  get: function (k) {
    try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {}
    return k in memoria ? memoria[k] : null;
  },
  set: function (k, v) { memoria[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { delete memoria[k]; try { localStorage.removeItem(k); } catch (e) {} }
};

function hora(ms) {
  return new Date(ms).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
}
function aleatorio() {
  const b = new Uint8Array(24);
  crypto.getRandomValues(b);
  return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
}
/** Identificador de este celular: se crea una vez y queda guardado en el navegador. */
function claveDispositivo() {
  let k = store.get('aq_disp');
  if (!k) { k = aleatorio(); store.set('aq_disp', k); }
  return k;
}
function ocupar(boton, si) { if (boton) boton.disabled = !!si; }
function mostrarError(texto) { const e = $('#err'); if (e) e.textContent = texto || ''; }


/* ═══════════════ Comunicación con el backend ═══════════════ */

async function api(accion, datos) {
  if (DEMO) return demoApi(accion, datos || {});
  let respuesta, json;
  try {
    respuesta = await fetch(API_URL, {
      method: 'POST',
      // text/plain evita el "preflight" de CORS, que Apps Script no contesta.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ accion: accion }, datos))
    });
  } catch (e) {
    throw new Error('Sin conexión. Revisá internet y probá de nuevo.');
  }
  try { json = await respuesta.json(); }
  catch (e) { throw new Error('El servidor respondió algo inesperado. Revisá la URL de la Web App.'); }
  if (!json.ok) throw new Error(json.error || 'Ocurrió un error.');
  return json.datos;
}

let sesion = store.get('aq_sesion');

async function apiDocente(accion, datos) {
  try {
    return await api(accion, Object.assign({ sesion: sesion }, datos));
  } catch (e) {
    if (e.message === 'SESION_VENCIDA') {
      salir('La sesión venció. Entrá de nuevo.');
      e.silencio = true;
    }
    throw e;
  }
}

function salir(mensaje) {
  sesion = null;
  store.del('aq_sesion');
  vistaLogin(mensaje);
}


/* ═══════════════ Docente: ingreso ═══════════════ */

function vistaLogin(mensaje) {
  detener();
  app.innerHTML =
    '<div class="hoja">' +
      '<section class="pizarra portada">' +
        '<h1>Asistencia QR</h1>' +
        '<p>El docente abre la clase, cada alumno escanea el código con su celular y queda presente en la planilla.</p>' +
      '</section>' +
      (DEMO ? '<p class="demo">Estás viendo la demostración, con alumnos inventados y sin guardar nada. Entrá con cualquier clave. Para usarlo de verdad, conectá la planilla siguiendo el README.</p>' : '') +
      '<label for="clave">Clave de docente</label>' +
      '<input id="clave" type="password" autocomplete="current-password" value="' + (DEMO ? 'demo' : '') + '">' +
      '<p class="error" id="err" role="alert">' + esc(mensaje || '') + '</p>' +
      '<button class="btn ancho" id="entrar" type="button">Entrar al panel</button>' +
      '<p class="nota" style="margin-top:1.5rem">¿Sos alumno? No entres por acá: escaneá el código que muestra tu docente.</p>' +
    '</div>';

  const entrar = async function () {
    const boton = $('#entrar');
    ocupar(boton, true); mostrarError('');
    try {
      const p = await api('login', { clave: $('#clave').value });
      sesion = p.sesion;
      store.set('aq_sesion', sesion);
      vistaPanel(p);
    } catch (e) {
      ocupar(boton, false);
      mostrarError(e.message);
    }
  };
  app.onclick = function (ev) { if (ev.target.id === 'entrar') entrar(); };
  app.onkeydown = function (ev) { if (ev.key === 'Enter' && ev.target.id === 'clave') entrar(); };
}


/* ═══════════════ Docente: elegir curso ═══════════════ */

function vistaPanel(p) {
  detener();
  let elegido = store.get('aq_curso');
  if (!p.cursos.some(function (c) { return c.nombre === elegido; })) {
    elegido = p.cursos.length === 1 ? p.cursos[0].nombre : null;
  }

  const abiertas = p.abiertas.length
    ? '<section class="abiertas"><h2>Clases abiertas</h2>' + p.abiertas.map(function (c) {
        return '<button class="btn claro ancho" type="button" data-retomar="' + esc(c.id) + '">Retomar ' + esc(c.curso) +
          (c.materia ? ', ' + esc(c.materia) : '') + ' (desde las ' + hora(c.inicio) + ')</button>';
      }).join('') + '</section>'
    : '';

  const formulario = p.cursos.length
    ? '<div class="cursos">' + p.cursos.map(function (c) {
        return '<button class="curso" type="button" data-curso="' + esc(c.nombre) + '" aria-pressed="' + (c.nombre === elegido) + '">' +
          '<b>' + esc(c.nombre) + '</b><small>' + c.alumnos + (c.alumnos === 1 ? ' alumno' : ' alumnos') + '</small></button>';
      }).join('') + '</div>' +
      '<label for="materia">Materia</label>' +
      '<input id="materia" type="text" maxlength="60" value="' + esc(store.get('aq_materia') || '') + '">' +
      '<label for="docente">Docente</label>' +
      '<input id="docente" type="text" maxlength="60" autocomplete="name" value="' + esc(store.get('aq_docente') || '') + '">' +
      '<p class="error" id="err" role="alert"></p>' +
      '<button class="btn ancho" id="iniciar" type="button">Abrir la clase y mostrar el código</button>'
    : '<p>Todavía no hay alumnos cargados. Abrí la planilla y completá la hoja Alumnos con DNI, nombre y curso.</p>';

  app.innerHTML =
    '<div class="hoja">' +
      '<header class="cabecera"><span>' + esc(p.escuela) + '</span><button class="enlace" id="salir" type="button">Salir</button></header>' +
      abiertas +
      '<h1>¿A qué curso le tomás lista?</h1>' +
      formulario +
    '</div>';

  const abrir = async function (boton, accion, datos) {
    ocupar(boton, true); mostrarError('');
    try { vistaClase(await apiDocente(accion, datos)); }
    catch (e) { ocupar(boton, false); if (!e.silencio) mostrarError(e.message); }
  };

  app.onkeydown = null;
  app.onclick = function (ev) {
    const t = ev.target.closest('button');
    if (!t) return;
    if (t.id === 'salir') return salir();
    if (t.dataset.retomar) return abrir(t, 'estado', { c: t.dataset.retomar });
    if (t.dataset.curso) {
      elegido = t.dataset.curso;
      Array.prototype.forEach.call(app.querySelectorAll('.curso'), function (b) {
        b.setAttribute('aria-pressed', String(b === t));
      });
      return;
    }
    if (t.id === 'iniciar') {
      if (!elegido) return mostrarError('Elegí un curso.');
      const materia = $('#materia').value.trim(), docente = $('#docente').value.trim();
      store.set('aq_curso', elegido); store.set('aq_materia', materia); store.set('aq_docente', docente);
      abrir(t, 'iniciar', { curso: elegido, materia: materia, docente: docente });
    }
  };
}


/* ═══════════════ Docente: clase en curso ═══════════════ */

let claseActiva = null;      // id de la clase que se está mostrando
let temporizador = null;
let ultimo = null;           // último estado recibido
let tokenDibujado = '';
let modoTablero = '';
let vistos = null;           // DNIs que ya estaban marcados (para animar solo los nuevos)
let filaAbierta = null;      // DNI con las opciones de marcado manual desplegadas
let firmaLista = '';

function detener() {
  claseActiva = null;
  clearTimeout(temporizador);
  document.body.classList.remove('proyector');
}

function vistaClase(e) {
  detener();
  claseActiva = e.clase.id;
  ultimo = null; tokenDibujado = ''; modoTablero = ''; vistos = null; filaAbierta = null; firmaLista = '';

  const detalle = [e.clase.materia, 'desde las ' + hora(e.clase.inicio)].filter(Boolean).join(', ');
  app.innerHTML =
    '<div class="clase">' +
      '<header class="barra">' +
        '<div><h1>' + esc(e.clase.curso) + '</h1><p>' + esc(detalle) + '</p></div>' +
        '<div class="acciones">' +
          '<button class="btn claro" id="proyectar" type="button">Pantalla completa</button>' +
          '<span class="acciones" id="zona-cierre"></span>' +
        '</div>' +
      '</header>' +
      '<div class="cuerpo">' +
        '<section class="pizarra tablero" id="tablero"></section>' +
        '<section class="lista"><h2>Lista del curso</h2><p class="nota" id="ayuda-lista"></p><ol id="lista"></ol></section>' +
      '</div>' +
      '<p class="aviso-red" id="aviso" role="status" hidden></p>' +
    '</div>';

  app.onkeydown = null;
  app.onclick = clicEnClase;
  pintar(e);
  if (e.clase.estado === 'ABIERTA') programar(Math.min(4000, e.msRestantes + 300));
}

function programar(ms) {
  clearTimeout(temporizador);
  temporizador = setTimeout(ciclo, ms);
}

async function ciclo() {
  const id = claseActiva;
  if (!id) return;
  if (document.hidden) return programar(2000);
  try {
    const e = await apiDocente('estado', { c: id });
    if (claseActiva !== id) return;
    $('#aviso').hidden = true;
    pintar(e);
    if (e.clase.estado === 'ABIERTA') programar(Math.min(4000, e.msRestantes + 300));
  } catch (err) {
    if (err.silencio || claseActiva !== id) return;
    const aviso = $('#aviso');
    aviso.textContent = 'Sin respuesta del servidor. Reintentando…';
    aviso.hidden = false;
    programar(5000);
  }
}

function pintar(e) {
  if (!$('#lista')) return;
  ultimo = e;
  const abierta = e.clase.estado === 'ABIERTA';
  const porDni = {};
  e.marcas.forEach(function (m) { porDni[m.dni] = m; });
  let presentes = 0, tardes = 0;
  e.alumnos.forEach(function (a) {
    const m = porDni[a.dni];
    if (m && m.estado === 'Presente') presentes++;
    else if (m && m.estado === 'Tarde') tardes++;
  });
  const total = e.alumnos.length;
  const ausentes = total - presentes - tardes;

  // Tablero: QR mientras la clase está abierta, resumen cuando se cierra.
  if (abierta) {
    if (modoTablero !== 'abierta') {
      modoTablero = 'abierta';
      $('#tablero').innerHTML =
        '<div class="qr" id="qr"></div>' +
        '<div class="tiempo"><i id="reloj"></i></div>' +
        '<p class="instruccion">Abrí la cámara del celular y apuntá al código</p>' +
        '<p class="conteo"><b id="n">0</b> de <span id="total">0</span> presentes</p>' +
        (DEMO ? '<button class="btn claro" id="simular" type="button">Simular que un alumno escanea</button>' +
                '<p class="nota">Demostración: este código todavía no lleva a ningún sitio.</p>' : '');
      $('#zona-cierre').innerHTML = '<button class="btn rojo" id="cerrar" type="button">Cerrar clase</button>';
      $('#ayuda-lista').textContent = 'Si alguien no tiene celular, tocá su nombre para marcarlo a mano.';
    }
    $('#n').textContent = presentes + tardes;
    $('#total').textContent = total;
    if (e.token !== tokenDibujado) {
      tokenDibujado = e.token;
      const base = DEMO ? 'https://tu-escuela.example/' : location.href.split(/[?#]/)[0];
      dibujarQR(base + '?c=' + e.clase.id + '&t=' + encodeURIComponent(e.token));
    }
    animarReloj(e.msRestantes, e.segundosQR * 1000);
  } else if (modoTablero !== 'cerrada') {
    modoTablero = 'cerrada';
    proyectar(false);
    $('#zona-cierre').innerHTML = '';
    $('#proyectar').hidden = true;
    $('#ayuda-lista').textContent = '';
    $('#tablero').innerHTML =
      '<h2 style="font-size:1.6rem">Clase cerrada</h2>' +
      '<dl class="resumen">' +
        '<div><dt>' + (presentes === 1 ? 'presente' : 'presentes') + '</dt><dd>' + presentes + '</dd></div>' +
        '<div><dt>tarde</dt><dd>' + tardes + '</dd></div>' +
        '<div><dt>' + (ausentes === 1 ? 'ausente' : 'ausentes') + '</dt><dd>' + ausentes + '</dd></div>' +
      '</dl>' +
      '<p>' + (DEMO ? 'En el sistema real, esto queda guardado en la hoja Asistencias de la planilla.'
                    : 'Quedó guardado en la hoja Asistencias de la planilla.') + '</p>' +
      '<button class="btn claro" id="otra" type="button">Tomar lista a otro curso</button>';
  }

  // Lista: se vuelve a dibujar solo si cambió algo.
  const firma = [e.marcas.length, total, e.clase.estado, filaAbierta].join('|');
  if (firma === firmaLista) return;
  firmaLista = firma;
  const primera = !vistos;
  if (primera) vistos = {};
  $('#lista').innerHTML = e.alumnos.map(function (a) {
    const m = porDni[a.dni];
    if (m) {
      const nuevo = !primera && !vistos[a.dni] && m.estado !== 'Ausente';
      vistos[a.dni] = true;
      const letra = m.estado === 'Tarde' ? 'T' : m.estado === 'Ausente' ? 'A' : 'P';
      return '<li' + (nuevo ? ' class="nuevo"' : '') + '><span class="nombre">' + esc(a.nombre) + '</span>' +
        '<span class="hora">' + esc(m.hora) + '</span>' +
        '<span class="marca ' + letra + '" role="img" aria-label="' + esc(m.estado) + '">' + letra + '</span></li>';
    }
    if (!abierta) {
      return '<li><span class="nombre">' + esc(a.nombre) + '</span><span class="marca vacia"></span></li>';
    }
    const desplegada = filaAbierta === a.dni;
    return '<li><button class="fila" type="button" data-dni="' + esc(a.dni) + '" aria-expanded="' + desplegada + '">' +
      '<span class="nombre">' + esc(a.nombre) + '</span><span class="marca vacia"></span></button>' +
      (desplegada
        ? '<div class="manual"><button class="btn" type="button" data-manual="Presente">Marcar presente</button>' +
          '<button class="btn claro" type="button" data-manual="Tarde">Marcar tarde</button></div>'
        : '') + '</li>';
  }).join('');
}

function clicEnClase(ev) {
  const t = ev.target.closest('button');
  if (!t || !ultimo) return;
  const id = ultimo.clase.id;

  if (t.id === 'proyectar') return proyectar(!document.body.classList.contains('proyector'));
  if (t.id === 'otra') return volverAlPanel(t);
  if (t.id === 'simular') { detener(); return vistaAlumno(id, ultimo.token, true); }

  if (t.id === 'cerrar') {
    const marcados = {};
    ultimo.marcas.forEach(function (m) { marcados[m.dni] = true; });
    const faltan = ultimo.alumnos.filter(function (a) { return !marcados[a.dni]; }).length;
    const texto = faltan === 0 ? 'No queda nadie ausente.' : faltan === 1 ? '1 alumno queda ausente.' : faltan + ' alumnos quedan ausentes.';
    $('#zona-cierre').innerHTML = '<span class="confirmar">¿Cerrar la clase? ' + texto + '</span>' +
      '<button class="btn rojo" id="si-cerrar" type="button">Sí, cerrar</button>' +
      '<button class="btn claro" id="no-cerrar" type="button">Seguir</button>';
    $('#si-cerrar').focus();
    return;
  }
  if (t.id === 'no-cerrar') {
    $('#zona-cierre').innerHTML = '<button class="btn rojo" id="cerrar" type="button">Cerrar clase</button>';
    return;
  }
  if (t.id === 'si-cerrar') return accionDeClase(t, 'cerrar', { c: id });

  if (t.dataset.dni) {
    filaAbierta = filaAbierta === t.dataset.dni ? null : t.dataset.dni;
    return pintar(ultimo);
  }
  if (t.dataset.manual && filaAbierta) {
    const dni = filaAbierta;
    filaAbierta = null;
    return accionDeClase(t, 'manual', { c: id, dni: dni, estado: t.dataset.manual });
  }
}

async function accionDeClase(boton, accion, datos) {
  ocupar(boton, true);
  clearTimeout(temporizador);
  try {
    const e = await apiDocente(accion, datos);
    if (claseActiva !== datos.c) return;
    pintar(e);
    if (e.clase.estado === 'ABIERTA') programar(Math.min(4000, e.msRestantes + 300));
  } catch (err) {
    if (err.silencio || claseActiva !== datos.c) return;
    ocupar(boton, false);
    const aviso = $('#aviso');
    aviso.textContent = err.message;
    aviso.hidden = false;
    programar(3000);
  }
}

async function volverAlPanel(boton) {
  ocupar(boton, true);
  try { vistaPanel(await apiDocente('panel', {})); }
  catch (e) { ocupar(boton, false); }
}

function proyectar(activar) {
  document.body.classList.toggle('proyector', activar);
  const boton = $('#proyectar');
  if (boton) boton.textContent = activar ? 'Salir de pantalla completa' : 'Pantalla completa';
  try {
    if (activar && document.documentElement.requestFullscreen) {
      const r = document.documentElement.requestFullscreen();
      if (r && r.catch) r.catch(function () {});
    } else if (!activar && document.fullscreenElement) {
      document.exitFullscreen();
    }
  } catch (e) {}
}
document.addEventListener('fullscreenchange', function () {
  if (!document.fullscreenElement && document.body.classList.contains('proyector')) proyectar(false);
});

function animarReloj(restan, total) {
  const r = $('#reloj');
  if (!r) return;
  restan = Math.max(0, restan);
  r.style.transition = 'none';
  r.style.transform = 'scaleX(' + Math.min(1, restan / total) + ')';
  void r.offsetWidth;                       // fuerza a aplicar el punto de partida
  r.style.transition = 'transform ' + restan + 'ms linear';
  r.style.transform = 'scaleX(0)';
}

/* El generador de QR se descarga solo en la pantalla del docente. */
let qrCargando = null;
function cargarQR() {
  if (window.qrcode) return Promise.resolve();
  if (!qrCargando) {
    qrCargando = new Promise(function (ok, mal) {
      const s = document.createElement('script');
      s.src = QR_LIB;
      s.onload = ok;
      s.onerror = function () { qrCargando = null; mal(new Error('sin generador')); };
      document.head.appendChild(s);
    });
  }
  return qrCargando;
}

function dibujarQR(texto) {
  cargarQR().then(function () {
    const caja = $('#qr');
    if (!caja) return;
    const q = window.qrcode(0, 'M');
    q.addData(texto);
    q.make();
    const n = q.getModuleCount(), margen = 3;
    let d = '';
    for (let f = 0; f < n; f++) {
      for (let c = 0; c < n; c++) {
        if (q.isDark(f, c)) d += 'M' + (c + margen) + ' ' + (f + margen) + 'h1v1h-1z';
      }
    }
    const lado = n + margen * 2;
    caja.innerHTML = '<svg viewBox="0 0 ' + lado + ' ' + lado + '" shape-rendering="crispEdges" role="img" aria-label="Código QR para dar el presente">' +
      '<rect width="' + lado + '" height="' + lado + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }).catch(function () {
    const caja = $('#qr');
    if (caja) caja.innerHTML = '<p>No se pudo cargar el generador de códigos. Revisá la conexión a internet y recargá la página.</p>';
    tokenDibujado = '';
  });
}


/* ═══════════════ Alumno ═══════════════ */

async function vistaAlumno(c, t, simulado) {
  app.onclick = null; app.onkeydown = null;
  app.innerHTML = '<section class="alumno espera"><p>Registrando tu presente…</p></section>';

  const dniGuardado = simulado ? null : store.get('aq_dni');
  const x = { c: c, simulado: !!simulado, dispositivo: simulado ? aleatorio() : claveDispositivo() };
  try {
    if (dniGuardado) {
      return exito(await api('marcar', { c: c, t: t, dni: dniGuardado, dispositivo: x.dispositivo }), x);
    }
    const s = await api('escanear', { c: c, t: t });
    x.pase = s.pase; x.curso = s.curso; x.materia = s.materia;
    pedirDni(x);
  } catch (e) {
    falla(e.message, x, !!dniGuardado);
  }
}

function pedirDni(x) {
  app.innerHTML =
    '<section class="alumno">' +
      '<p class="donde">' + esc(x.curso) + (x.materia ? ', ' + esc(x.materia) : '') + '</p>' +
      '<h1>Primera vez con este celular</h1>' +
      '<p>Escribí tu DNI una sola vez. De ahora en más, con escanear el código alcanza.</p>' +
      '<label for="dni">Tu DNI, sin puntos</label>' +
      '<input id="dni" type="text" inputmode="numeric" autocomplete="off" maxlength="10">' +
      '<p class="error" id="err" role="alert"></p>' +
      '<button class="btn ancho" id="seguir" type="button">Continuar</button>' +
      (x.simulado ? '<p class="demo">Demostración: probá con el DNI ' + esc(demoSugerencia()) + '.</p>' +
                    '<button class="btn claro ancho" id="volver" type="button">Volver al panel del docente</button>' : '') +
    '</section>';

  const campo = $('#dni');
  campo.focus();
  const seguir = async function () {
    const dni = campo.value.replace(/\D/g, '');
    if (dni.length < 6) return mostrarError('Escribí tu DNI completo.');
    const boton = $('#seguir');
    ocupar(boton, true); mostrarError('');
    try {
      const a = await api('consultar', { c: x.c, pase: x.pase, dni: dni });
      confirmarIdentidad(x, dni, a.nombre);
    } catch (e) {
      ocupar(boton, false);
      mostrarError(e.message);
    }
  };
  app.onclick = function (ev) {
    if (ev.target.id === 'seguir') seguir();
    if (ev.target.id === 'volver') volverDeSimulacion(x);
  };
  app.onkeydown = function (ev) { if (ev.key === 'Enter' && ev.target.id === 'dni') seguir(); };
}

function confirmarIdentidad(x, dni, nombre) {
  app.innerHTML =
    '<section class="alumno">' +
      '<h1>¿Sos ' + esc(nombre) + '?</h1>' +
      '<p>Este celular queda vinculado a tu nombre y no va a servir para dar el presente de otra persona.</p>' +
      '<p class="error" id="err" role="alert"></p>' +
      '<button class="btn ancho" id="si" type="button">Sí, dar el presente</button>' +
      '<button class="btn claro ancho" id="no" type="button">No, corregir el DNI</button>' +
    '</section>';
  app.onkeydown = null;
  app.onclick = async function (ev) {
    if (ev.target.id === 'no') return pedirDni(x);
    if (ev.target.id !== 'si') return;
    ocupar(ev.target, true); mostrarError('');
    try {
      const r = await api('marcar', { c: x.c, pase: x.pase, dni: dni, dispositivo: x.dispositivo });
      if (!x.simulado) store.set('aq_dni', dni);
      exito(r, x);
    } catch (e) {
      ocupar(ev.target, false);
      mostrarError(e.message);
    }
  };
}

function exito(r, x) {
  const tarde = r.estado === 'Tarde';
  app.innerHTML =
    '<section class="alumno resultado ' + (tarde ? 'tarde' : 'ok') + '">' +
      '<h1>' + (tarde ? 'Tarde' : 'Presente') + '</h1>' +
      '<p class="quien">' + esc(r.nombre) + '</p>' +
      '<p>' + esc(r.curso) + (r.materia ? ', ' + esc(r.materia) : '') + '</p>' +
      '<p>' + (r.yaEstaba ? 'Ya habías dado el presente a las ' : 'Registrado a las ') + esc(r.hora) + '</p>' +
      '<p class="nota">Ya podés cerrar esta página.</p>' +
      (x.simulado ? '<button class="btn claro" id="volver" type="button">Volver al panel del docente</button>' : '') +
    '</section>';
  app.onkeydown = null;
  app.onclick = function (ev) { if (ev.target.id === 'volver') volverDeSimulacion(x); };
  // Se limpia la dirección para que recargar la página no reenvíe un código vencido.
  if (!x.simulado) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
}

function falla(mensaje, x, teniaDni) {
  app.innerHTML =
    '<section class="alumno resultado mal">' +
      '<h1>No se registró tu presente</h1>' +
      '<p class="motivo">' + esc(mensaje) + '</p>' +
      '<p class="nota" id="que-hacer">Volvé a escanear el código de la pantalla. Si sigue sin andar, pedile al docente que te marque a mano.</p>' +
      (teniaDni ? '<button class="btn claro" id="olvidar" type="button">El DNI guardado en este celular no es el mío</button>' : '') +
      (x.simulado ? '<button class="btn claro" id="volver" type="button">Volver al panel del docente</button>' : '') +
    '</section>';
  app.onkeydown = null;
  app.onclick = function (ev) {
    if (ev.target.id === 'volver') return volverDeSimulacion(x);
    if (ev.target.id === 'olvidar') {
      store.del('aq_dni');
      ev.target.remove();
      $('#que-hacer').textContent = 'Listo, se borró el DNI guardado. Volvé a escanear el código y escribí el tuyo.';
    }
  };
}

async function volverDeSimulacion(x) {
  try { vistaClase(await apiDocente('estado', { c: x.c })); } catch (e) { vistaLogin(); }
}


/* ═══════════════ Modo demostración (sin backend) ═══════════════
   Imita las respuestas de Codigo.gs con datos en memoria, para poder
   ver el flujo completo antes de conectar la planilla.              */

const demo = {
  alumnos: [
    ['40111001', 'Acosta, Martina', '3° B'], ['40111002', 'Benítez, Tomás', '3° B'],
    ['40111003', 'Cardozo, Lucía', '3° B'], ['40111004', 'Domínguez, Bruno', '3° B'],
    ['40111005', 'Escobar, Valentina', '3° B'], ['40111006', 'Figueroa, Santino', '3° B'],
    ['40111007', 'Gómez, Abril', '3° B'], ['40111008', 'Ledesma, Thiago', '3° B'],
    ['40222001', 'Giménez, Camila', '5° A'], ['40222002', 'Herrera, Joaquín', '5° A'],
    ['40222003', 'Ibáñez, Sofía', '5° A'], ['40222004', 'Juárez, Mateo', '5° A']
  ].map(function (a) { return { dni: a[0], nombre: a[1], curso: a[2] }; }),
  clase: null,
  marcas: []
};

function demoSugerencia() {
  const libre = demoLista().filter(function (a) {
    return !demo.marcas.some(function (m) { return m.dni === a.dni; });
  })[0];
  return libre ? libre.dni + ' (' + libre.nombre + ')' : demoLista()[0].dni;
}
function demoLista() {
  return demo.alumnos.filter(function (a) { return demo.clase && a.curso === demo.clase.curso; })
    .map(function (a) { return { dni: a.dni, nombre: a.nombre }; });
}
function demoEstado() {
  const seg = 20, ahora = Date.now(), ventana = Math.floor(ahora / (seg * 1000));
  return {
    clase: Object.assign({}, demo.clase),
    token: demo.clase.estado === 'ABIERTA' ? 'demo' + (ventana % 100000) : '',
    msRestantes: (ventana + 1) * seg * 1000 - ahora,
    segundosQR: seg,
    alumnos: demoLista(),
    marcas: demo.marcas.slice()
  };
}
function demoMarcar(alumno, estado) {
  const m = { dni: alumno.dni, nombre: alumno.nombre, hora: estado === 'Ausente' ? '' : hora(Date.now()), estado: estado };
  demo.marcas.push(m);
  return m;
}
function demoAlumno(dni) {
  const a = demoLista().filter(function (x) { return x.dni === String(dni).replace(/\D/g, ''); })[0];
  if (!a) throw new Error('No encontramos ese DNI en la lista de alumnos. Revisalo o avisale al docente.');
  return a;
}
function demoPanel() {
  const cursos = {};
  demo.alumnos.forEach(function (a) { cursos[a.curso] = (cursos[a.curso] || 0) + 1; });
  return {
    sesion: 'demo',
    escuela: 'Escuela de demostración',
    cursos: Object.keys(cursos).map(function (c) { return { nombre: c, alumnos: cursos[c] }; }),
    abiertas: demo.clase && demo.clase.estado === 'ABIERTA' ? [Object.assign({}, demo.clase)] : []
  };
}
function demoAccion(accion, d) {
  switch (accion) {
    case 'login': case 'panel': return demoPanel();
    case 'iniciar':
      if (!(demo.clase && demo.clase.estado === 'ABIERTA' && demo.clase.curso === d.curso)) {
        demo.clase = { id: 'DEMO42', curso: d.curso, materia: d.materia, docente: d.docente, inicio: Date.now(), estado: 'ABIERTA' };
        demo.marcas = [];
      }
      return demoEstado();
    case 'estado': return demoEstado();
    case 'manual':
      if (!demo.marcas.some(function (m) { return m.dni === d.dni; })) demoMarcar(demoAlumno(d.dni), d.estado === 'Tarde' ? 'Tarde' : 'Presente');
      return demoEstado();
    case 'cerrar':
      demoLista().forEach(function (a) {
        if (!demo.marcas.some(function (m) { return m.dni === a.dni; })) demoMarcar(a, 'Ausente');
      });
      demo.clase.estado = 'CERRADA';
      return demoEstado();
    case 'escanear': return { pase: 'demo', curso: demo.clase.curso, materia: demo.clase.materia };
    case 'consultar': return { nombre: demoAlumno(d.dni).nombre, curso: demo.clase.curso };
    case 'marcar': {
      if (demo.clase.estado !== 'ABIERTA') throw new Error('La clase ya está cerrada. Avisale al docente.');
      const a = demoAlumno(d.dni);
      const previa = demo.marcas.filter(function (m) { return m.dni === a.dni; })[0];
      const tarde = (Date.now() - demo.clase.inicio) / 60000 > 10;
      const m = previa || demoMarcar(a, tarde ? 'Tarde' : 'Presente');
      return { nombre: a.nombre, curso: demo.clase.curso, materia: demo.clase.materia, hora: m.hora, estado: m.estado, yaEstaba: !!previa };
    }
  }
  throw new Error('Acción desconocida.');
}
function demoApi(accion, d) {
  return new Promise(function (ok, mal) {
    setTimeout(function () {
      try { ok(demoAccion(accion, d)); } catch (e) { mal(e); }
    }, 300);
  });
}


/* ═══════════════ Arranque ═══════════════ */

(async function arrancar() {
  let c = null, t = null;
  try {
    const p = new URLSearchParams(location.search);
    c = p.get('c'); t = p.get('t');
  } catch (e) {}
  if (c && t && !DEMO) return vistaAlumno(c, t, false);

  if (sesion && !DEMO) {
    app.innerHTML = '<section class="alumno espera"><p>Cargando…</p></section>';
    try { return vistaPanel(await apiDocente('panel', {})); }
    catch (e) { if (e.silencio) return; }
  }
  vistaLogin();
})();

})();
